name: daily-digest
# 21:00 Cairo (18:00 UTC): outreach numbers + new part-time remote IT jobs to Telegram. Runs with the PC off.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ahmedbasher55/first-dollar-online
          token: ${{ secrets.WORK_REPO_TOKEN }}
          path: work
          fetch-depth: 1
      - name: Send digest
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WORK_DIR: work
        run: python digest.py
      - name: Remember which jobs were already sent
        working-directory: work
        run: |
          git config user.name "Claude (cloud digest)"
          git config user.email "a_basher2000@hotmail.com"
          git add jobs/alerts_seen.txt
          git commit -q -m "Daily digest: job alerts seen" || exit 0
          git pull -q --rebase origin main && git push -q origin main
